# ---------------------------------------------------------------------------
# Listeners
#
# Deploy to /etc/mosquitto/conf.d/tls.conf
#
# Certificate files, all owned mosquitto:mosquitto:
#   /etc/mosquitto/certs/ca.crt       from ca/ca.crt          (0644)
#   /etc/mosquitto/certs/server.crt   from certs/server.crt    (0644)
#   /etc/mosquitto/certs/server.key   from private/server.key  (0600)
#   /etc/mosquitto/certs/ca.crl       from ca/ca.crl           (0644)
#
# Wrong ownership/permissions on server.key makes Mosquitto fail to start with
# no useful log line. Check this first if startup breaks.
#
# Mosquitto 2.x also warns about a world-readable acl_file:
#   "Warning: File ... has world readable permissions."
# Fix with: chmod 0700 /etc/mosquitto/acl && chown mosquitto:mosquitto ...
# ---------------------------------------------------------------------------

# --- 1883: plain, loopback only --------------------------------------------
# Bound to 127.0.0.1 so it is never reachable off-box. Delete this block
# entirely if nothing on the broker host needs plaintext MQTT.
listener 1883 127.0.0.1
allow_anonymous true


# --- 8883: TLS, server-auth only, certificate login ---------------------------
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
allow_anonymous true

# --- 8884: mTLS — the UG65 gateway -----------------------------------------
listener 8884
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key

# In Mosquitto 2.x `tls_version` is a MINIMUM, not an exact pin; it was an exact
# pin in 1.6.x and earlier. With tlsv1.2 set, a 1.3-capable client negotiates
# 1.3 and a 1.2-only mbedTLS client negotiates 1.2. The effect is to refuse
# anything older than 1.2.
#
# Setting a single `ciphers_tls1.3` ciphersuite does not force 1.2-only. It
# makes TLS 1.3 clients fail the handshake ("alert handshake failure") instead
# of falling back to 1.2.
tls_version tlsv1.2

# The two lines that define mTLS:
#   require_certificate       reject any client without a valid cert
#   use_identity_as_username  MQTT username := client cert CN
# Together these mean no passwords, and ACLs key off the cert CN.
require_certificate true
use_identity_as_username true

# Revocation. A revoked client cert is rejected at handshake with
# "alert certificate revoked"; valid certs still connect. Generate with
# `make crl`.
#
# Uncomment after the first `make crl` — Mosquitto will not start if crlfile
# points at a missing file.
# crlfile /etc/mosquitto/certs/ca.crl

acl_file /etc/mosquitto/acl
