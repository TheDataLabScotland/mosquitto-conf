# ---------------------------------------------------------------------------
# Mosquitto — main configuration
#
# Listener layout mirrors test.mosquitto.org:
#   1883  plain, loopback only    local tooling
#   8883  TLS, password auth      humans, laptops, dashboards
#   8884  TLS + client cert       the UG65 gateway (mTLS)
#
# Deploy to /etc/mosquitto/mosquitto.conf (or include from it).
# ---------------------------------------------------------------------------

# REQUIRED when mixing auth modes across listeners. Without it, auth settings
# leak between listeners and you get surprising results — e.g. the mTLS
# listener silently accepting password auth.
per_listener_settings true

allow_anonymous false

persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
log_type error
log_type warning
log_type notice
log_type information
# Uncomment while debugging TLS. Very chatty; do not leave on.
# log_type all
# log_type debug

# Do not let a stuck gateway wedge the broker.
max_queued_messages 1000
message_size_limit 65536

include_dir /etc/mosquitto/conf.d
